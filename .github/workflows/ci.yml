name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python paper/check_submission.py
      - run: pytest -q
      - if: matrix.python-version == '3.11'
        run: |
          python paper/make_mechanistic_evidence_axis_figure.py
          python paper/make_multichannel_anchor_figure.py
          python paper/make_boundary_identification_figure.py
          python paper/build_reviewer_bundle.py
          PYTHONPATH=outputs/reviewer_bundle python -m pytest --rootdir=outputs/reviewer_bundle -q outputs/reviewer_bundle/tests
