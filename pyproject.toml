[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecological-boundary"
version = "0.1.0"
description = "Identification boundaries for mechanistic evidence in ecological measurement chains"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["boundary_model*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
